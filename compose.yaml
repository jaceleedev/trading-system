name: trading-research
services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: trading
      POSTGRES_PASSWORD: ${TRADING_LOCAL_DB_PASSWORD:-local-research-only}
      POSTGRES_DB: trading
    ports:
      - "127.0.0.1:${TRADING_LOCAL_DB_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading -d trading"]
      interval: 2s
      timeout: 3s
      retries: 30
    cpus: 2.0
    mem_limit: 2g
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  postgres-data:
